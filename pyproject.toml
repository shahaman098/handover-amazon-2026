[project]
name = "handover"
version = "0.1.0"
description = "Alexa+ simulation: evidence-linked application handoffs with provenance ledger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "mcp>=1.9.0,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
